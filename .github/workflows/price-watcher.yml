name: Price Watcher

on:
  # Run every 10 minutes
  schedule:
    - cron: '*/10 * * * *'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers and dependencies
        run: |
          playwright install chromium
          playwright install-deps chromium
      
      - name: Install xvfb for virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      
      - name: Create config.json from secrets
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys
          
          watchers_config = os.environ.get("WATCHERS_CONFIG", "[]")
          
          # Validate and parse watchers config
          try:
              if not watchers_config or watchers_config.strip() == "":
                  print("Warning: WATCHERS_CONFIG is empty, using empty array")
                  watchers = []
              else:
                  watchers = json.loads(watchers_config)
                  if not isinstance(watchers, list):
                      print(f"Error: WATCHERS_CONFIG must be a JSON array, got {type(watchers)}")
                      sys.exit(1)
          except json.JSONDecodeError as e:
              print(f"Error: Invalid JSON in WATCHERS_CONFIG: {e}")
              print(f"WATCHERS_CONFIG value: {repr(watchers_config[:200])}")  # Show first 200 chars
              sys.exit(1)
          
          config = {
              "telegram_bot_token": os.environ.get("TELEGRAM_BOT_TOKEN", ""),
              "telegram_chat_id": os.environ.get("TELEGRAM_CHAT_ID", ""),
              "watchers": watchers
          }
          
          # Validate required fields
          if not config["telegram_bot_token"]:
              print("Error: TELEGRAM_BOT_TOKEN is required")
              sys.exit(1)
          if not config["telegram_chat_id"]:
              print("Error: TELEGRAM_CHAT_ID is required")
              sys.exit(1)
          
          with open("config.json", "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
          
          print(f"✓ Created config.json with {len(watchers)} watcher(s)")
          EOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHERS_CONFIG: ${{ secrets.WATCHERS_CONFIG }}
      
      - name: Run price watcher
        run: xvfb-run -a python3 main.py
